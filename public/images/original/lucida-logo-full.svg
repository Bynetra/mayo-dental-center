<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="fullCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C0E8" />
      <stop offset="100%" stop-color="#0789A4" />
    </linearGradient>
    <linearGradient id="fullGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99D342" />
      <stop offset="100%" stop-color="#70A72B" />
    </linearGradient>
  </defs>

  <!-- Emblem on left (90x90 scaled) -->
  <g transform="translate(10, 5) scale(0.26)">
    <g transform="translate(170, 170) rotate(-22) translate(-170, -170)">
      <path d="M 65,170 A 105,150 0 0,1 275,170" stroke="url(#fullCyanGrad)" stroke-width="8.5" stroke-linecap="round" />
      <path d="M 275,170 A 105,150 0 0,1 65,170" stroke="url(#fullGreenGrad)" stroke-width="8.5" stroke-linecap="round" />
      <path d="M 125,108 C 112,135 106,170 120,205 C 130,228 148,245 170,250 C 158,235 152,215 150,195 C 146,165 156,135 170,118 C 155,104 136,102 125,108 Z" fill="url(#fullCyanGrad)" />
      <path d="M 170,118 C 190,105 212,108 222,122 C 238,145 236,182 220,215 C 208,238 188,248 170,250 C 182,238 195,220 200,195 C 208,162 196,135 170,118 Z" fill="url(#fullGreenGrad)" />
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(110, 24)">
    <!-- Primary Latin Wordmark -->
    <text x="0" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" letter-spacing="1.5" fill="#0E1F2C">
      LUCIDA
    </text>
    <text x="122" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="24" letter-spacing="2" fill="#0AABCB">
      DENTAL
    </text>

    <!-- Subtitle Arabic and English -->
    <text x="1" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" letter-spacing="3" fill="#6FA52B">
      CENTER
    </text>
    <text x="76" y="47" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#849AA8">
      •
    </text>
    <text x="92" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans Arabic', sans-serif" font-weight="700" font-size="14" fill="#3D5160">
      مركز لوسيدا لطب الأسنان
    </text>
    <text x="250" y="47" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#849AA8">
      •
    </text>
    <text x="264" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" letter-spacing="1" fill="#0AABCB">
      AL WAAB, DOHA
    </text>
  </g>
</svg>
